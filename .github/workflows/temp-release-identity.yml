name: temp-release-identity
on:
  push:
    branches: [fix/release-identity-no-downgrade]
jobs:
  release-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/release-identity.test.mjs
