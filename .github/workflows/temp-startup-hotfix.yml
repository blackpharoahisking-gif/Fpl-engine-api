name: temp-startup-hotfix
on:
  push:
    branches: [hotfix/restore-08264-startup]
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js && node --check release-identity.js && node --check market-impact-inspector.js
      - run: node --test test/startup-loader-order.test.mjs test/release-identity.test.mjs test/player-market-impact.test.mjs test/scoring-integrity.test.mjs test/market-projection-sync.test.mjs
