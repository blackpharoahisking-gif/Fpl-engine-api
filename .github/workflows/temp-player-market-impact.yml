name: temp-player-market-impact
on:
  push:
    branches: [feat/player-market-impact]
jobs:
  market-impact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js && node --check release-identity.js && node --check market-impact-inspector.js
      - run: node --test test/player-market-impact.test.mjs test/release-identity.test.mjs
