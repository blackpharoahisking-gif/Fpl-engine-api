name: One-shot Planner route variance patch

on:
  push:
    branches:
      - codex/planner-route-variance-v1
    paths:
      - .github/workflows/codex-planner-route-variance.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/planner-route-variance-v1
          fetch-depth: 0
      - name: Patch route-level Planner variance
        shell: python
        run: |
          from pathlib import Path
          import re

          def replace_one(path, pattern, replacement, flags=re.S):
              p=Path(path); text=p.read_text()
              new,n=re.subn(pattern,replacement,text,count=1,flags=flags)
              if n!=1:
                  raise SystemExit(f'{path}: expected one replacement, got {n}')
              p.write_text(new)

          # Frontend payload: preserve weekly Safe/Upside selection utility, but
          # also send a risk-neutral strategic utility so route risk is applied
          # once, to the discounted multi-GW distribution rather than once per GW.
          payload = r'''function transferPlannerPayload(){
            syncTransferSettings();
            const gws=transferGameweeks(),profile=transferStrategyProfile(),styleRisk=profile.risk||'mean',riskCoeff=styleRisk==='safe'?-.25:styleRisk==='upside'?.20:0,
              styleUtility=r=>r.x+riskCoeff*r.sd,
              players=transferCandidatePool(gws).map(p=>{
                const signal=builderStyleSignal(p,profile,gws);let decay=1;
                const gwMap=Object.fromEntries(gws.map(g=>{
                  const r=project(p,g),md=minuteDetail(p),adj=signal*decay;decay*=(profile.horizonScale||1);
                  return[g,{mean:r.x,baseUtility:r.x+adj,utility:styleUtility(r)+adj,pAppear:md.pAppear,sd:r.sd,confidence:r.confidence}]
                }));
                return{id:p.id,n:p.n,p:p.p,t:p.t,c:p.c,gw:gwMap}
              }),
              current=squadPlayers(),purchase=Object.fromEntries(current.map(p=>[p.id,transferBoughtPrice(p)])),
              chips={wc:[S.chips.WC1,S.chips.WC2].filter(Boolean).map(Number),fh:[S.chips.FH1,S.chips.FH2].filter(Boolean).map(Number),bb:[S.chips.BB1,S.chips.BB2].filter(Boolean).map(Number),tc:[S.chips.TC1,S.chips.TC2].filter(Boolean).map(Number)},
              hybrid={decay:S.transfer.decay,beamWidth:8,actionsPerState:6,bufferGws:gws.length>=5?2:1,useFriction:S.transfer.useFriction,itbValue:S.transfer.itbValue,ftScale:S.transfer.ftScale,stressCandidateLimit:12,riskMode:styleRisk,riskCoeff,routeRho:(typeof HORIZON_CORRELATION!=='undefined'&&HORIZON_CORRELATION)?clamp(num(HORIZON_RHO),0,1):0},
              sensitivity=S.transfer.sensitivityRuns>1?{runs:S.transfer.sensitivityRuns,strength:S.transfer.sensitivityStrength,seed:20262027}:null;
            return{players,gws,squadIds:current.map(p=>p.id),purchase,bank:S.transfer.bank,free:S.transfer.free,maxMoves:S.transfer.maxMoves,maxHit:S.transfer.maxHit,threshold:S.transfer.threshold,lockedIds:current.filter(p=>S.locks.has(p.id)).map(p=>p.id),chips,hybrid,sensitivity}
          }'''
          replace_one('app-core.js',r'function transferPlannerPayload\(\)\{.*?\}\nfunction combinedWorkerSource',payload+'\nfunction combinedWorkerSource')

          # Shared worker autosub: add a risk-neutral/base utility channel without
          # changing existing mean or selection-utility behaviour.
          autosub = r'''function autosub(r){
            const startGK=r.xi.find(o=>o.p.p==='GK'),benchGK=r.bench.find(o=>o.p.p==='GK'),startOut=r.xi.filter(o=>o.p.p!=='GK'),benchOut=r.bench.filter(o=>o.p.p!=='GK'),sc=xiCounts(startOut),critical=new Set(Object.keys(OUT_MIN).filter(k=>sc[k]===OUT_MIN[k])),order=[...benchOut].sort((a,b)=>(critical.has(b.p.p)?1:0)-(critical.has(a.p.p)?1:0)||b.g.utility-a.g.utility),baseMetric=o=>Number.isFinite(o?.g?.baseUtility)?o.g.baseUtility:o.g.utility,conditionalBase=o=>clamp(baseMetric(o)/Math.max(.03,o.g.pAppear),-12,25);
            let mean=0,utility=0,baseUtility=0;
            if(startGK&&benchGK){const miss=1-startGK.g.pAppear;mean+=miss*benchGK.g.mean;utility+=miss*benchGK.g.utility;baseUtility+=miss*baseMetric(benchGK)}
            for(const st of missingStates(startOut)){
              const slots=st.DEF+st.MID+st.FWD;if(!slots||st.prob<1e-8)continue;const base={DEF:sc.DEF-st.DEF,MID:sc.MID-st.MID,FWD:sc.FWD-st.FWD};
              for(let mask=0;mask<8;mask++){
                let pm=1;const appeared=[];for(let j=0;j<3;j++){const ap=order[j].g.pAppear,on=!!(mask&(1<<j));pm*=on?ap:1-ap;if(on)appeared.push(order[j])}if(pm<1e-8)continue;
                for(const o of selectedAutosubs(base,slots,appeared)){const w=st.prob*pm;mean+=w*conditional(o,'mean');utility+=w*conditional(o,'utility');baseUtility+=w*conditionalBase(o)}
              }
            }
            const fullMean=r.bench.reduce((a,o)=>a+o.g.mean,0),fullUtility=r.bench.reduce((a,o)=>a+o.g.utility,0),fullBaseUtility=r.bench.reduce((a,o)=>a+baseMetric(o),0);
            return{mean:clamp(mean,0,Math.max(0,fullMean)),utility:clamp(utility,-12,Math.max(-12,fullUtility)),baseUtility:clamp(baseUtility,-12,Math.max(-12,fullBaseUtility)),fullMean,fullUtility,fullBaseUtility,order}
          }'''
          replace_one('FPL_Engine_OTB.html',r'function autosub\(r\)\{.*?\}\n</script>\n<script id="transferWorkerSource"',autosub+'\n</script>\n<script id="transferWorkerSource"')

          p=Path('FPL_Engine_OTB.html'); html=p.read_text()
          old="const DEFAULT_CFG={decay:.90,beamWidth:8,actionsPerState:6,bufferGws:2,useFriction:.20,itbValue:.08,ftScale:1,ftState:[0,0,1.35,2.35,3.05,3.55],exploreTolerance:.75,explorePerState:2,stressCandidateLimit:12};\nfunction cfg(raw={}){return{...DEFAULT_CFG,...raw,ftState:Array.isArray(raw.ftState)?raw.ftState:DEFAULT_CFG.ftState}}"
          new="const DEFAULT_CFG={decay:.90,beamWidth:8,actionsPerState:6,bufferGws:2,useFriction:.20,itbValue:.08,ftScale:1,ftState:[0,0,1.35,2.35,3.05,3.55],exploreTolerance:.75,explorePerState:2,stressCandidateLimit:12,riskMode:'mean',riskCoeff:0,routeRho:.35};\nfunction cfg(raw={}){const out={...DEFAULT_CFG,...raw,ftState:Array.isArray(raw.ftState)?raw.ftState:DEFAULT_CFG.ftState};out.riskCoeff=clamp(Number.isFinite(+out.riskCoeff)?+out.riskCoeff:0,-1,1);out.routeRho=clamp(Number.isFinite(+out.routeRho)?+out.routeRho:.35,0,1);return out}"
          if old not in html: raise SystemExit('transfer cfg source not found')
          html=html.replace(old,new,1)

          oldp="function perturbPlayers(players,strength,rng){return players.map(x=>{const playerShock=gauss(rng),gw={};for(const k of Object.keys(x.gw)){const g=x.gw[k],sd=Number.isFinite(g.sd)?g.sd:0;if(sd<=0){gw[k]=g;continue}const z=.75*playerShock+.66*gauss(rng),shift=z*sd*strength;gw[k]={...g,mean:Math.max(0,g.mean+shift),utility:g.utility+shift}}return{...x,gw}})}"
          newp="function perturbPlayers(players,strength,rng){return players.map(x=>{const playerShock=gauss(rng),gw={};for(const k of Object.keys(x.gw)){const g=x.gw[k],sd=Number.isFinite(g.sd)?g.sd:0;if(sd<=0){gw[k]=g;continue}const z=.75*playerShock+.66*gauss(rng),shift=z*sd*strength;gw[k]={...g,mean:Math.max(0,g.mean+shift),utility:g.utility+shift,baseUtility:Number.isFinite(g.baseUtility)?g.baseUtility+shift:g.baseUtility}}return{...x,gw}})}"
          if oldp not in html: raise SystemExit('perturbPlayers source not found')
          html=html.replace(oldp,newp,1);p.write_text(html)

          route_math = r'''function metricBase(g){return Number.isFinite(g?.baseUtility)?g.baseUtility:g?.utility||0}
          function gwPredictiveSd(r,bb,tc){
            let variance=0;
            for(const o of r.xi){const sd=Math.max(0,Number.isFinite(+o.g.sd)?+o.g.sd:0),mult=o.p.id===r.captain.p.id?(tc?3:2):1;variance+=(mult*sd)*(mult*sd)}
            if(bb)for(const o of r.bench){const sd=Math.max(0,Number.isFinite(+o.g.sd)?+o.g.sd:0);variance+=sd*sd}
            return Math.sqrt(Math.max(0,variance))
          }
          function routeRiskSd(varSum,sdSum,c){const rho=clamp(c.routeRho,0,1);return Math.sqrt(Math.max(0,varSum+rho*(sdSum*sdSum-varSum)))}
          function routeRiskUtility(base,varSum,sdSum,c){return base+c.riskCoeff*routeRiskSd(varSum,sdSum,c)}
          function advanceRisk(node,weight,d,stageBase,c){const q=Math.abs(weight)*Math.max(0,Number.isFinite(+d.sd)?+d.sd:0),baseCumulative=node.baseCumulative+weight*stageBase,varSum=node.varSum+q*q,sdSum=node.sdSum+q;return{baseCumulative,varSum,sdSum,cumulative:routeRiskUtility(baseCumulative,varSum,sdSum,c)}}
          function scoreGw(ids,gw,p,ctx){
            const key=ids.slice().sort((a,b)=>a-b).join(',')+'|'+gw+'|'+(p.chips.bb.includes(gw)?'B':'')+(p.chips.tc.includes(gw)?'T':'');if(ctx.score.has(key))return ctx.score.get(key);
            const r=bestXI(ids,gw,p.byId);if(!r){const bad={mean:-1e9,utility:-1e9,baseUtility:-1e9,sd:0};ctx.score.set(key,bad);return bad}
            const b=autosub(r),bb=p.chips.bb.includes(gw),tc=p.chips.tc.includes(gw);
            let mean=r.xi.reduce((a,o)=>a+o.g.mean,0)+r.captain.g.mean+(bb?b.fullMean:b.mean),utility=r.xi.reduce((a,o)=>a+o.g.utility,0)+r.captain.g.utility+(bb?b.fullUtility:b.utility),baseUtility=r.xi.reduce((a,o)=>a+metricBase(o.g),0)+metricBase(r.captain.g)+(bb?b.fullBaseUtility:b.baseUtility);
            if(tc){mean+=r.captain.g.mean;utility+=r.captain.g.utility;baseUtility+=metricBase(r.captain.g)}
            const z={mean,utility,baseUtility,sd:gwPredictiveSd(r,bb,tc),captainId:r.captain.p.id,formation:r.formation,benchOrder:r.bench.filter(o=>o.p.p!=='GK').sort((a,b)=>b.g.utility-a.g.utility).map(o=>o.p.id)};ctx.score.set(key,z);return z
          }
          function routeScore(ids,wi,p,c,ctx){
            if(wi>=p.gws.length)return{mean:0,baseUtility:0,utility:0,sd:0,varSum:0,sdSum:0};
            const key=ids.slice().sort((a,b)=>a-b).join(',')+'|'+wi+'|'+c.decay.toFixed(4)+'|'+c.riskCoeff.toFixed(3)+'|'+c.routeRho.toFixed(3);if(ctx.route.has(key))return ctx.route.get(key);
            let mean=0,baseUtility=0,varSum=0,sdSum=0;
            for(let i=wi;i<p.gws.length;i++){const gw=p.gws[i];if(p.chips.fh.includes(gw))continue;const z=scoreGw(ids,gw,p,ctx),w=c.decay**(i-wi),q=Math.abs(w)*z.sd;mean+=w*z.mean;baseUtility+=w*z.baseUtility;varSum+=q*q;sdSum+=q}
            const sd=routeRiskSd(varSum,sdSum,c),out={mean,baseUtility,utility:baseUtility+c.riskCoeff*sd,sd,varSum,sdSum};ctx.route.set(key,out);return out
          }'''
          replace_one('FPL_Engine_OTB.html',r'function scoreGw\(ids,gw,p,ctx\)\{.*?\}\nfunction routeScore\(ids,wi,p,c,ctx\)\{.*?\}\nfunction sellPrice',route_math+'\nfunction sellPrice')

          replace_one('FPL_Engine_OTB.html',r'function rankNode\(node,nextWi,p,c,ctx\)\{.*?\}',"function rankNode(node,nextWi,p,c,ctx){const future=routeScore(node.st.ids,nextWi,p,c,ctx),w=c.decay**nextWi,base=node.baseCumulative+w*future.baseUtility,varSum=node.varSum+w*w*future.varSum,sdSum=node.sdSum+Math.abs(w)*future.sdSum;return routeRiskUtility(base,varSum,sdSum,c)+ftValue(node.ft,c)+c.itbValue*node.st.bank}",flags=0)

          plan = r'''function planScenario(raw,config,report=false){
            const p={...raw,byId:new Map(raw.players.map(x=>[x.id,x]))},c=cfg(config),ctx=scenarioContext();if(!legal(p.squadIds,p.byId))throw new Error('Current squad is not a legal 15-player squad.');
            const transferDepth=Math.max(1,p.gws.length-Math.min(c.bufferGws,Math.max(0,p.gws.length-1)));
            let beam=[{st:{ids:[...p.squadIds],bank:p.bank,purchase:{...p.purchase}},ft:clamp(p.free,1,5),cumulative:0,baseCumulative:0,varSum:0,sdSum:0,plan:[]}];
            for(let wi=0;wi<p.gws.length;wi++){
              const gw=p.gws[wi],weight=c.decay**wi,next=[];if(report)postMessage({type:'progress',progress:.78*wi/Math.max(1,p.gws.length),detail:`Hybrid search GW${gw} · ${beam.length} live route${beam.length===1?'':'s'}`});
              for(const node of beam){
                const beforeFt=node.ft,old=stateCopy(node.st);
                if(p.chips.fh.includes(gw)){
                  const d=scoreGw(node.st.ids,gw,p,ctx),ftAfter=beforeFt,risk=advanceRisk(node,weight,d,d.baseUtility,c);
                  next.push({st:node.st,ft:ftAfter,...risk,plan:[...node.plan,{gw,chip:'FH',moves:[],hit:0,ftBefore:beforeFt,ftAfter,bankAfter:node.st.bank,netGain:0,meanGain:0,score:d.mean,captainId:d.captainId,formation:d.formation,note:'Free Hit week — permanent route paused; Chip Intelligence evaluates the temporary-squad upside.'}]});continue
                }
                if(p.chips.wc.includes(gw)){
                  const w=wildcardImprove(node.st,wi,p,c,ctx),st=w.state,ftAfter=beforeFt,d=scoreGw(st.ids,gw,p,ctx),base=routeScore(old.ids,wi,p,c,ctx),net=w.route.utility-base.utility,risk=advanceRisk(node,weight,d,d.baseUtility,c);
                  next.push({st,ft:ftAfter,...risk,plan:[...node.plan,{gw,chip:'WC',moves:changedMoves(old.ids,st.ids,p,old.purchase),hit:0,ftBefore:beforeFt,ftAfter,bankAfter:st.bank,netGain:net,meanGain:w.route.mean-base.mean,score:d.mean,captainId:d.captainId,formation:d.formation,note:'Wildcard rebuild selected by the hybrid route evaluator.'}]});continue
                }
                const actions=wi<transferDepth?actionOptions(node.st,wi,beforeFt,p,c,ctx):[{state:node.st,moves:[],hit:0,friction:0,ftAfter:clamp(beforeFt+1,1,5),net:0,meanGain:0,candidateCount:0,opportunity:null,note:'Evaluation-buffer gameweek — hold the squad to avoid an end-of-horizon transfer.'}];
                for(const a of actions){const d=scoreGw(a.state.ids,gw,p,ctx),risk=advanceRisk(node,weight,d,d.baseUtility-a.hit-a.friction,c);next.push({st:a.state,ft:a.ftAfter,...risk,plan:[...node.plan,{gw,chip:'',moves:a.moves,hit:a.hit,ftBefore:beforeFt,ftAfter:a.ftAfter,bankAfter:a.state.bank,netGain:a.net,meanGain:a.meanGain,score:d.mean,captainId:d.captainId,formation:d.formation,candidateCount:a.candidateCount||0,opportunity:a.opportunity||null,exploratory:!!a.exploratory,note:a.note}]})}
              }
              const bestByKey=new Map;for(const n of next){const k=stateKey(n),old=bestByKey.get(k);if(!old||n.cumulative>old.cumulative)bestByKey.set(k,n)}
              beam=[...bestByKey.values()].sort((a,b)=>rankNode(b,wi+1,p,c,ctx)-rankNode(a,wi+1,p,c,ctx)).slice(0,c.beamWidth)
            }
            const finals=beam.map(n=>{const routeSd=routeRiskSd(n.varSum,n.sdSum,c),baseObjective=n.baseCumulative+ftValue(n.ft,c)+c.itbValue*n.st.bank;return{...n,routeSd,baseObjective,objective:routeRiskUtility(n.baseCumulative,n.varSum,n.sdSum,c)+ftValue(n.ft,c)+c.itbValue*n.st.bank}}).sort((a,b)=>b.objective-a.objective);
            let best=finals[0];if(!best)throw new Error('Hybrid search produced no legal route.');
            const rollFirst=finals.find(n=>planSignature(n.plan)==='ROLL');if(rollFirst&&planSignature(best.plan)!=='ROLL'&&best.objective-rollFirst.objective+1e-9<p.threshold)best=rollFirst;
            const seen=new Set([planSignature(best.plan)]),alternatives=[];for(const n of finals){if(n===best||n.objective>best.objective+1e-9)continue;const sig=planSignature(n.plan);if(seen.has(sig))continue;seen.add(sig);alternatives.push({plan:n.plan,objective:n.objective,baseObjective:n.baseObjective,routeSd:n.routeSd,gap:best.objective-n.objective,signature:sig});if(alternatives.length===2)break}
            const opportunity=best.plan?.[0]?.opportunity||null,candidateRoutes=[],candidateSeen=new Set;for(const n of [best,...finals]){const signature=planSignature(n.plan);if(candidateSeen.has(signature))continue;candidateSeen.add(signature);candidateRoutes.push({signature,plan:n.plan,finalBank:n.st.bank,finalFt:n.ft,baselineObjective:n.objective,routeSd:n.routeSd});if(candidateRoutes.length>=c.stressCandidateLimit)break}
            return{plan:best.plan,finalIds:best.st.ids,finalBank:best.st.bank,finalPurchase:best.st.purchase,finalFt:best.ft,objective:best.objective,baseObjective:best.baseObjective,routeSd:best.routeSd,routeRisk:{mode:c.riskMode,coefficient:c.riskCoeff,rho:c.routeRho,autosubVariance:'excluded unless Bench Boost'},transferDepth,evaluationHorizon:p.gws.length,alternatives,opportunity,signature:planSignature(best.plan),stressCandidates:candidateRoutes}
          }'''
          replace_one('FPL_Engine_OTB.html',r'function planScenario\(raw,config,report=false\)\{.*?\}\nfunction firstActionSignature',plan+'\nfunction firstActionSignature')

          replay = r'''function replayFixedRoute(raw,config,candidate){
            const p={...raw,byId:new Map(raw.players.map(x=>[x.id,x]))},c=cfg(config),ctx=scenarioContext();let ids=[...p.squadIds],base=0,varSum=0,sdSum=0,finalFt=clamp(p.free,1,5),finalBank=p.bank;
            for(let wi=0;wi<candidate.plan.length;wi++){
              const row=candidate.plan[wi],moves=row.chip==='FH'?[]:(row.moves||[]);for(const m of moves)ids=ids.map(id=>id===m.outId?m.inId:id);if(!legal(ids,p.byId))return-1e9;
              const d=scoreGw(ids,row.gw,p,ctx);if(!Number.isFinite(d.baseUtility))return-1e9;const used=row.chip==='WC'||row.chip==='FH'?0:moves.length,hit=Number.isFinite(+row.hit)?+row.hit:0,w=c.decay**wi,q=Math.abs(w)*d.sd;base+=w*(d.baseUtility-hit-used*c.useFriction);varSum+=q*q;sdSum+=q;finalFt=clamp(Number.isFinite(+row.ftAfter)?+row.ftAfter:finalFt,1,5);finalBank=Number.isFinite(+row.bankAfter)?+row.bankAfter:finalBank
            }
            return routeRiskUtility(base,varSum,sdSum,c)+ftValue(finalFt,c)+c.itbValue*finalBank
          }'''
          replace_one('FPL_Engine_OTB.html',r'function replayFixedRoute\(raw,config,candidate\)\{.*?\}\nfunction runProjectionStress',replay+'\nfunction runProjectionStress')

          # Build/cache identity. Keep the deliberate 08.28.1 semantic baseline marker.
          oldver='2026.08.29.2'; newver='2026.08.29.3'; oldshort='08.29.2'; newshort='08.29.3'; oldrx=r'2026\\.08\\.29\\.2'; newrx=r'2026\\.08\\.29\\.3'
          for name in ['FPL_Engine_OTB.html','app.js','app-live-points.js','release-identity.js','variance-propagation.js']:
              p=Path(name); text=p.read_text(); p.write_text(text.replace(oldver,newver).replace(oldshort,newshort))
          for p in Path('test').glob('*.mjs'):
              text=p.read_text(); updated=text.replace(oldver,newver).replace(oldshort,newshort).replace(oldrx,newrx)
              if updated!=text:p.write_text(updated)

          test = r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';

          const html=readFileSync(new URL('../FPL_Engine_OTB.html',import.meta.url),'utf8');
          const app=readFileSync(new URL('../app-core.js',import.meta.url),'utf8');
          const block=id=>{const m=html.match(new RegExp(`<script id="${id}" type="text/plain">([\\s\\S]*?)<\\/script>`));assert.ok(m,`${id} missing`);return m[1]};
          const source=block('workerCommonSource')+'\n'+block('transferWorkerSource');
          const h=Function(`let onmessage;const postMessage=()=>{};${source}\nreturn{cfg,scenarioContext,scoreGw,routeScore,routeRiskSd,routeRiskUtility,planScenario};`)();

          function payload({tc=false,bb=false}={}){
            const gws=[1,2],pos=['GK','GK','DEF','DEF','DEF','DEF','DEF','MID','MID','MID','MID','MID','FWD','FWD','FWD'],players=[];
            for(let i=0;i<15;i++){
              const id=i+1,gw={};for(const g of gws){const mean=i===7?8:4,sd=i===7?2:1;gw[g]={mean,baseUtility:mean,utility:mean,pAppear:.92,sd,confidence:80}}
              players.push({id,n:`P${id}`,p:pos[i],t:`T${1+(i%5)}`,c:5,gw})
            }
            return{players,gws,squadIds:players.map(x=>x.id),purchase:Object.fromEntries(players.map(x=>[x.id,5])),bank:0,free:1,maxMoves:1,maxHit:4,threshold:0,lockedIds:[],chips:{wc:[],fh:[],bb:bb?[1]:[],tc:tc?[1]:[]},hybrid:{decay:.9,beamWidth:4,actionsPerState:3,bufferGws:1,useFriction:0,itbValue:0,ftScale:1,stressCandidateLimit:4,riskMode:'safe',riskCoeff:-.25,routeRho:.35},sensitivity:null}
          }

          test('planner payload separates selection utility from risk-neutral route utility',()=>{
            assert.match(app,/baseUtility:r\.x\+adj/);
            assert.match(app,/riskCoeff=styleRisk==='safe'\?-\.25:styleRisk==='upside'\?\.20:0/);
            assert.match(app,/routeRho:\(typeof HORIZON_CORRELATION/);
          });

          test('captain variance scales with the square of the scoring multiplier',()=>{
            const raw=payload(),p={...raw,byId:new Map(raw.players.map(x=>[x.id,x]))},ctx=h.scenarioContext(),normal=h.scoreGw(raw.squadIds,1,p,ctx);
            // Captain is P8: XI variance includes captain at 2x, not two independent copies.
            const captain=raw.players[7];assert.equal(normal.captainId,captain.id);
            const baseWithoutCaptain=normal.sd**2-(2*captain.gw[1].sd)**2;
            const rawTc=payload({tc:true}),pTc={...rawTc,byId:new Map(rawTc.players.map(x=>[x.id,x]))},tc=h.scoreGw(rawTc.squadIds,1,pTc,h.scenarioContext());
            assert.ok(Math.abs(tc.sd**2-(baseWithoutCaptain+(3*captain.gw[1].sd)**2))<1e-9);
          });

          test('discounted route variance uses the shared rho form',()=>{
            const raw=payload(),p={...raw,byId:new Map(raw.players.map(x=>[x.id,x]))},c=h.cfg(raw.hybrid),ctx=h.scenarioContext(),s1=h.scoreGw(raw.squadIds,1,p,ctx),s2=h.scoreGw(raw.squadIds,2,p,ctx),r=h.routeScore(raw.squadIds,0,p,c,ctx),q1=s1.sd,q2=.9*s2.sd,expected=Math.sqrt(q1*q1+q2*q2+.35*((q1+q2)**2-q1*q1-q2*q2));
            assert.ok(Math.abs(r.sd-expected)<1e-9);
            assert.ok(Math.abs(r.utility-(r.baseUtility-.25*r.sd))<1e-9);
          });

          test('mean route mode remains variance-inert while Safe uses route sd',()=>{
            const raw=payload(),p={...raw,byId:new Map(raw.players.map(x=>[x.id,x]))},mean=h.cfg({...raw.hybrid,riskMode:'mean',riskCoeff:0}),safe=h.cfg(raw.hybrid),a=h.routeScore(raw.squadIds,0,p,mean,h.scenarioContext()),b=h.routeScore(raw.squadIds,0,p,safe,h.scenarioContext());
            assert.equal(a.utility,a.baseUtility);
            assert.ok(b.utility<b.baseUtility);
            assert.ok(b.sd>0);
          });

          test('primary route result exposes route uncertainty and risk semantics',()=>{
            const raw=payload(),r=h.planScenario(raw,raw.hybrid,false);
            assert.ok(Number.isFinite(r.routeSd)&&r.routeSd>0);
            assert.equal(r.routeRisk.mode,'safe');
            assert.equal(r.routeRisk.coefficient,-.25);
            assert.equal(r.routeRisk.rho,.35);
            assert.match(source,/objective:routeRiskUtility\(n\.baseCumulative,n\.varSum,n\.sdSum,c\)/);
            assert.match(source,/return routeRiskUtility\(base,varSum,sdSum,c\)\+ftValue/);
          });
          '''
          Path('test/transfer-route-variance-v1.test.mjs').write_text(test)
      - name: Verify route-level Planner variance
        run: |
          node --check app-core.js
          node --check variance-propagation.js
          npm test
      - name: Commit bounded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FPL_Engine_OTB.html app-core.js app.js app-live-points.js release-identity.js variance-propagation.js test/
          if git diff --cached --quiet; then
            echo 'Planner route variance patch already applied.'
            exit 0
          fi
          git commit -m 'Use route-level variance in Transfer Planner'
          git push origin HEAD:codex/planner-route-variance-v1
