name: One-shot Planner full-route diversity repair

on:
  push:
    branches:
      - codex/planner-full-route-diversity
    paths:
      - .github/workflows/codex-full-route-diversity.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/planner-full-route-diversity
          fetch-depth: 0
      - name: Repair full-route identity and alternative display
        shell: python
        run: |
          from pathlib import Path

          html_path=Path('FPL_Engine_OTB.html')
          html=html_path.read_text()

          old="function planSignature(plan){const row=plan[0];if(!row)return'NONE';if(row.chip)return row.chip;return row.moves?.length?row.moves.map(m=>m.outId+'>'+m.inId).sort().join('|'):'ROLL'}"
          new=old+"\nfunction routeSignature(plan){if(!Array.isArray(plan)||!plan.length)return'NONE';return plan.map(row=>{const action=row.chip?row.chip:(row.moves?.length?row.moves.map(m=>m.outId+'>'+m.inId).sort().join('|'):'ROLL');return row.gw+':'+action}).join('||')}"
          if html.count(old)!=1: raise SystemExit(f'planSignature anchor count={html.count(old)}')
          html=html.replace(old,new,1)

          old="const seen=new Set([planSignature(best.plan)]),alternatives=[];for(const n of finals){if(n===best||n.objective>best.objective+1e-9)continue;const sig=planSignature(n.plan);if(seen.has(sig))continue;seen.add(sig);alternatives.push({plan:n.plan,objective:n.objective,baseObjective:n.baseObjective,routeSd:n.routeSd,gap:best.objective-n.objective,signature:sig});if(alternatives.length===2)break}"
          new="const seenRoutes=new Set([routeSignature(best.plan)]),alternatives=[];for(const n of finals){if(n===best||n.objective>best.objective+1e-9)continue;const routeSig=routeSignature(n.plan);if(seenRoutes.has(routeSig))continue;seenRoutes.add(routeSig);alternatives.push({plan:n.plan,objective:n.objective,baseObjective:n.baseObjective,routeSd:n.routeSd,gap:best.objective-n.objective,signature:planSignature(n.plan),routeSignature:routeSig});if(alternatives.length===2)break}"
          if html.count(old)!=1: raise SystemExit(f'alternative anchor count={html.count(old)}')
          html=html.replace(old,new,1)

          old="const opportunity=best.plan?.[0]?.opportunity||null,candidateRoutes=[],candidateSeen=new Set;for(const n of [best,...finals]){const signature=planSignature(n.plan);if(candidateSeen.has(signature))continue;candidateSeen.add(signature);candidateRoutes.push({signature,plan:n.plan,finalBank:n.st.bank,finalFt:n.ft,baselineObjective:n.objective,routeSd:n.routeSd});if(candidateRoutes.length>=c.stressCandidateLimit)break}"
          new="const opportunity=best.plan?.[0]?.opportunity||null,candidateRoutes=[],candidateSeen=new Set;for(const n of [best,...finals]){const routeSig=routeSignature(n.plan);if(candidateSeen.has(routeSig))continue;candidateSeen.add(routeSig);candidateRoutes.push({signature:planSignature(n.plan),routeSignature:routeSig,plan:n.plan,finalBank:n.st.bank,finalFt:n.ft,baselineObjective:n.objective,routeSd:n.routeSd});if(candidateRoutes.length>=c.stressCandidateLimit)break}"
          if html.count(old)!=1: raise SystemExit(f'candidate route anchor count={html.count(old)}')
          html=html.replace(old,new,1)

          old="return{plan:best.plan,finalIds:best.st.ids,finalBank:best.st.bank,finalPurchase:best.st.purchase,finalFt:best.ft,objective:best.objective,baseObjective:best.baseObjective,routeSd:best.routeSd,routeRisk:{mode:c.riskMode,coefficient:c.riskCoeff,rho:c.routeRho,autosubVariance:'excluded unless Bench Boost'},transferDepth,evaluationHorizon:p.gws.length,alternatives,opportunity,signature:planSignature(best.plan),stressCandidates:candidateRoutes}"
          new="return{plan:best.plan,finalIds:best.st.ids,finalBank:best.st.bank,finalPurchase:best.st.purchase,finalFt:best.ft,objective:best.objective,baseObjective:best.baseObjective,routeSd:best.routeSd,routeRisk:{mode:c.riskMode,coefficient:c.riskCoeff,rho:c.routeRho,autosubVariance:'excluded unless Bench Boost'},transferDepth,evaluationHorizon:p.gws.length,alternatives,opportunity,signature:planSignature(best.plan),routeSignature:routeSignature(best.plan),stressCandidates:candidateRoutes}"
          if html.count(old)!=1: raise SystemExit(f'return anchor count={html.count(old)}')
          html=html.replace(old,new,1)
          html_path.write_text(html)

          app_path=Path('app-core.js')
          app=app_path.read_text()
          old="function transferFirstActionText(plan){const w=plan?.[0];if(!w)return'No route';if(w.chip)return`${w.chip} in GW${w.gw}`;if(!w.moves?.length)return`Roll in GW${w.gw}`;return w.moves.map(m=>`${m.outName} → ${m.inName}`).join('; ')}"
          new=old+"\nfunction transferRouteText(plan){if(!Array.isArray(plan)||!plan.length)return'No route';const parts=[];for(const w of plan){if(w.chip){parts.push(`GW${w.gw} ${w.chip}`);continue}if(!w.moves?.length)continue;parts.push(`GW${w.gw} ${w.moves.map(m=>`${m.outName} → ${m.inName}`).join('; ')}`)}return parts.length?parts.join(' · '):`Roll through GW${plan[plan.length-1]?.gw??'—'}`}"
          if app.count(old)!=1: raise SystemExit(f'transferFirstActionText anchor count={app.count(old)}')
          app=app.replace(old,new,1)
          old="const altMarkup=(result.alternatives||[]).map((a,i)=>`<div class=\"hybrid-alt\"><b>Alternative ${i+1}:</b> ${esc(transferFirstActionText(a.plan))} · ${num(a.gap).toFixed(2)} hybrid points behind.</div>`).join('');"
          new="const altMarkup=(result.alternatives||[]).map((a,i)=>`<div class=\"hybrid-alt\"><b>Alternative route ${i+1}:</b> ${esc(transferRouteText(a.plan))} · ${num(a.gap).toFixed(2)} hybrid points behind.</div>`).join('');"
          if app.count(old)!=1: raise SystemExit(f'alt markup anchor count={app.count(old)}')
          app=app.replace(old,new,1)
          app_path.write_text(app)

          # Product-visible decision integrity fix: advance build coherently.
          oldver='2026.08.29.3'; newver='2026.08.29.4'; oldshort='08.29.3'; newshort='08.29.4'
          for name in ['FPL_Engine_OTB.html','app.js','app-live-points.js','release-identity.js','variance-propagation.js']:
              p=Path(name); text=p.read_text(); p.write_text(text.replace(oldver,newver).replace(oldshort,newshort))
          for p in Path('test').glob('*.mjs'):
              text=p.read_text(); updated=text.replace(oldver,newver).replace(oldshort,newshort).replace(r'2026\.08\.29\.3',r'2026\.08\.29\.4')
              if updated!=text:p.write_text(updated)

          test=Path('test/transfer-full-route-diversity.test.mjs')
          test.write_text(r'''import test from 'node:test';
          import assert from 'node:assert/strict';
          import {readFileSync} from 'node:fs';

          const html=readFileSync(new URL('../FPL_Engine_OTB.html',import.meta.url),'utf8');
          const app=readFileSync(new URL('../app-core.js',import.meta.url),'utf8');
          const block=id=>{const m=html.match(new RegExp(`<script id="${id}" type="text/plain">([\\s\\S]*?)<\\/script>`));assert.ok(m,`${id} missing`);return m[1]};
          const source=block('workerCommonSource')+'\n'+block('transferWorkerSource');
          const h=Function(`let onmessage;const postMessage=()=>{};${source}\nreturn{planSignature,routeSignature};`)();

          const move=(gw,outId,inId)=>({gw,chip:'',moves:[{outId,inId}]});

          test('full route identity distinguishes plans that share the same first transfer',()=>{
            const a=[move(2,1,2),move(3,3,4)];
            const b=[move(2,1,2),move(3,5,6)];
            assert.equal(h.planSignature(a),h.planSignature(b));
            assert.notEqual(h.routeSignature(a),h.routeSignature(b));
          });

          test('alternative and stress candidate dedupe use full route identity',()=>{
            assert.match(source,/seenRoutes=new Set\(\[routeSignature\(best\.plan\)\]\)/);
            assert.match(source,/candidateSeen\.has\(routeSig\)/);
            assert.match(source,/routeSignature:routeSig/);
          });

          test('primary result retains first-action identity and also publishes full route identity',()=>{
            assert.match(source,/signature:planSignature\(best\.plan\),routeSignature:routeSignature\(best\.plan\)/);
          });

          test('alternative UI shows the complete transfer route rather than only GW1 of the plan',()=>{
            assert.match(app,/function transferRouteText\(plan\)/);
            assert.match(app,/Alternative route \$\{i\+1\}:/);
            assert.match(app,/esc\(transferRouteText\(a\.plan\)\)/);
          });
          ''')
      - name: Verify repair
        run: |
          node --check app-core.js
          npm test
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FPL_Engine_OTB.html app-core.js app.js app-live-points.js release-identity.js variance-propagation.js test
          git commit -m "Repair Planner full-route diversity" || exit 0
          git push origin HEAD:codex/planner-full-route-diversity
