name: One-shot variance probe guard

on:
  push:
    branches:
      - codex/variance-probe-guard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/variance-probe-guard
          fetch-depth: 0
      - name: Guard probe and synchronize hotfix identity
        shell: python
        run: |
          from pathlib import Path

          p=Path('variance-propagation.js')
          text=p.read_text()
          old="finally{setMode('repaired');restoreUserState(saved);installRiskAwareAutoXi();probeBusy=false}"
          new="finally{setMode('repaired');restoreUserState(saved);if(probeDone)installRiskAwareAutoXi();probeBusy=false}"
          if old not in text and new not in text:
              raise SystemExit('variance probe finalizer not found')
          text=text.replace(old,new)
          text=text.replace("const VERSION='variance-propagation-v1.0'","const VERSION='variance-propagation-v1.1'")
          text=text.replace("const BUILD='2026.08.29.1'","const BUILD='2026.08.29.2'")
          p.write_text(text)

          oldver='2026.08.29.1'
          newver='2026.08.29.2'
          oldshort='08.29.1'
          newshort='08.29.2'
          oldrx=r'2026\.08\.29\.1'
          newrx=r'2026\.08\.29\.2'
          for name in ['FPL_Engine_OTB.html','app.js','app-live-points.js','release-identity.js']:
              p=Path(name); text=p.read_text(); text=text.replace(oldver,newver).replace(oldshort,newshort); p.write_text(text)

          # Preserve the deliberate 08.28.1 semantic-baseline marker in the
          # variance layer. Current-release tests, including regex source checks,
          # must move with the deployed shell/cache identity.
          for p in Path('test').glob('*.mjs'):
              text=p.read_text()
              updated=text.replace(oldver,newver).replace(oldshort,newshort).replace(oldrx,newrx)
              if updated!=text:
                  p.write_text(updated)

          # Add the failure guard to the focused test so a failed probe can never
          # alter XI selection before a valid frozen comparison exists.
          p=Path('test/variance-propagation-v1.test.mjs')
          text=p.read_text()
          needle="  assert.match(layer,/const plan=bestXIForGw\\(list,null,S\\.gw\\)/);\n"
          guard="  assert.match(layer,/if\\(probeDone\\)installRiskAwareAutoXi\\(\\);probeBusy=false/);\n"
          if guard not in text:
              if needle not in text: raise SystemExit('variance focused test insertion point missing')
              text=text.replace(needle,needle+guard)
          p.write_text(text)
      - name: Verify hotfix
        run: |
          node --check variance-propagation.js
          npm test
      - name: Commit hotfix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add FPL_Engine_OTB.html app.js app-live-points.js release-identity.js variance-propagation.js test/
          if git diff --cached --quiet; then
            echo 'Hotfix already applied.'
            exit 0
          fi
          git commit -m 'Guard XI fallback until variance probe completes'
          git push origin HEAD:codex/variance-probe-guard
