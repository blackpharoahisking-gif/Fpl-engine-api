name: scoring-integrity-ci
on:
  push:
    branches: [fix/scoring-integrity-invariants]
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test test/scoring-integrity.test.mjs test/scoring-integrity-fixture-caps.test.mjs test/market-projection-sync.test.mjs
