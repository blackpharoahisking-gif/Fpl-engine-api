name: temp-full-suite
on:
  push:
    branches: [fix/scoring-integrity-invariants]
jobs:
  main-baseline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
